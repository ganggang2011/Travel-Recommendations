  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='74' font-size='80'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E" />

<body>
  <header class="site-header is-solid" data-header-mode="solid">
    <div class="container">
      <a class="brand" href="index.html">
        <span class="brand-mark">✈</span>
        <span>云游</span>
      </a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="destinations.html" class="is-active">目的地</a>
        <a href="index.html#themes">主题</a>
        <a href="index.html#stories">故事</a>
        <a href="index.html#newsletter">订阅</a>
      </nav>
      <a href="#dest-grid" class="btn btn--primary header-cta">查看列表</a>
      <button class="nav-toggle" aria-label="菜单"><span></span></button>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <div class="crumbs" data-reveal="up">
        <a href="index.html">首页</a>
        <span>/</span>
        <span>目的地</span>
      </div>
      <h1 data-reveal="up">全球精选目的地</h1>
      <p class="lead" data-reveal="up" style="--reveal-delay:100ms">按你的心情选一段旅程。我们从 128 个目的地里挑出最值得出发的，再写成你读得下去的攻略。</p>
    </div>
  </section>

  <section class="container" id="dest-grid">
    <div class="filters" data-reveal="up">
      <label class="search">
        <span aria-hidden="true">🔍</span>
        <input type="search" placeholder="搜索城市、国家或关键词…" data-filter-search />
      </label>
      <select data-filter-region aria-label="区域">
        <option value="">全部区域</option>
        <option>东亚</option>
        <option>东南亚</option>
        <option>欧洲</option>
        <option>北美</option>
        <option>非洲</option>
        <option>大洋洲</option>
      </select>
      <select data-filter-sort aria-label="排序">
        <option value="recommend">推荐排序</option>
        <option value="price-asc">价格从低到高</option>
        <option value="price-desc">价格从高到低</option>
        <option value="rating">评分最高</option>
        <option value="reviews">评价最多</option>
      </select>
    </div>

    <div class="filter-chips" data-filter-themes></div>

    <div class="result-meta" data-result-meta></div>

    <div class="dest-grid" data-dest-grid></div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a class="brand" href="index.html" style="color:#fff">
            <span class="brand-mark">✈</span>
            <span>云游</span>
          </a>
          <p>发现下一段值得出发的旅程。我们挑选最好看的目的地，写最有温度的攻略。</p>
          <div class="socials">
            <a href="#">W</a>
            <a href="#">R</a>
            <a href="#">Ig</a>
            <a href="#">Yt</a>
          </div>
        </div>
        <div class="footer-col"><h4>产品</h4><ul><li><a href="destinations.html">目的地</a></li><li><a href="index.html#themes">主题旅行</a></li><li><a href="#">路线规划器</a></li></ul></div>
        <div class="footer-col"><h4>资源</h4><ul><li><a href="index.html#stories">旅行故事</a></li><li><a href="#">摄影指南</a></li><li><a href="#">帮助中心</a></li></ul></div>

        <span>© 2026 云游 Yunyou · 所有图片版权归原作者所有</span>
        <span>中文 · 简体</span>
      </div>
    </div>
  </footer>

  <script src="assets/data/destinations.js"></script>

  <script src="assets/js/list.js"></script>
