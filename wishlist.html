<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的心愿单 · 云游</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='74' font-size='80' font-family='serif' font-style='italic' fill='%23b6532b'%3EY%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..500,30..100,0..1;1,9..144,300..500,30..100,0..1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/home.css" />
  <link rel="stylesheet" href="assets/css/list.css" />
  <link rel="stylesheet" href="assets/css/tools.css" />
</head>
<body>
  <div data-chrome="header"></div>

  <section class="tool-page">
    <div class="container">
      <div class="tool-head">
        <div>
          <div class="crumbs">
            <a href="index.html">HOME</a><span class="sep">/</span><span>WISHLIST</span>
          </div>
          <h1>心愿 <em>待行</em>。</h1>
        </div>
        <div class="summary">
          <strong><span data-wish-total>0</span> 个</strong>
          已加入心愿单的目的地。随时可以点击 ♥ 图标把它们一起带走。
          <div style="margin-top:20px;display:flex;gap:12px;">
            <a class="btn btn--outline" href="destinations.html">添加更多</a>
            <button class="btn btn--link" data-wish-clear>清空</button>
          </div>
        </div>
      </div>

      <div class="wish-grid editorial-grid" data-wish-grid></div>

      <div class="tool-empty" data-wish-empty style="display:none">
        <h3>心愿单还是空的</h3>
        <p>去目的地页把想去的地方 ♡ 起来吧。</p>
        <a class="btn btn--primary" href="destinations.html">去挑几个目的地 <span class="arrow">→</span></a>
      </div>
    </div>
  </section>

  <div data-chrome="footer"></div>

  <script src="assets/data/destinations.js"></script>
  <script src="assets/js/features.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/wishlist.js"></script>
</body>
</html>
